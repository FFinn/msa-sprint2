stages:
  - unit
  - build
  - test
  - deploy
  - tag

variables:
  IMAGE_NAME: booking-service
  IMAGE_TAG: latest
  IMAGE_ARCHIVE: booking-service-image.tar
  CONTAINER_NAME: booking-service-test
  FEATURE_CONTAINER_NAME: booking-service-feature-test
  NAMESPACE: default

unit:
  stage: unit
  script:
    - cd booking-service
    - go test ./...

build:
  stage: build
  needs: ["unit"]
  script:
    - docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" ./booking-service
    - docker save -o "${IMAGE_ARCHIVE}" "${IMAGE_NAME}:${IMAGE_TAG}"
  artifacts:
    paths:
      - booking-service-image.tar

test:
  stage: test
  needs:
    - job: build
      artifacts: true
  script:
    - |
      cleanup() {
        docker rm -f "${CONTAINER_NAME}" "${FEATURE_CONTAINER_NAME}" >/dev/null 2>&1 || true
      }
      trap cleanup EXIT

      cleanup

      wait_for_http() {
        local url="$1"
        local attempt
        for attempt in $(seq 1 30); do
          if curl --fail --silent "${url}" >/dev/null; then
            return 0
          fi
          sleep 1
        done
        echo "Timed out waiting for ${url}" >&2
        return 1
      }

      assert_body() {
        local expected="$1"
        local url="$2"
        local actual
        actual="$(curl --fail --silent "${url}")"
        if [ "${actual}" != "${expected}" ]; then
          echo "Expected ${url} to return '${expected}', got '${actual}'" >&2
          return 1
        fi
      }

      docker load -i "${IMAGE_ARCHIVE}"
      docker run -d --name "${CONTAINER_NAME}" -p 18080:8080 "${IMAGE_NAME}:${IMAGE_TAG}"
      wait_for_http "http://localhost:18080/ping"
      assert_body "pong" "http://localhost:18080/ping"
      curl --fail --silent http://localhost:18080/health >/dev/null
      curl --fail --silent http://localhost:18080/ready >/dev/null
      feature_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:18080/feature)"
      if [ "${feature_status}" != "404" ]; then
        echo "/feature must return 404 when ENABLE_FEATURE_X is disabled; got ${feature_status}" >&2
        exit 1
      fi

      docker run -d --name "${FEATURE_CONTAINER_NAME}" -p 18081:8080 -e ENABLE_FEATURE_X=true "${IMAGE_NAME}:${IMAGE_TAG}"
      wait_for_http "http://localhost:18081/ping"
      assert_body "Feature X is enabled!" "http://localhost:18081/feature"

deploy:
  stage: deploy
  needs:
    - job: build
      artifacts: true
    - job: test
  script:
    - docker load -i "${IMAGE_ARCHIVE}"
    - minikube status >/dev/null 2>&1 || minikube start --driver=docker
    - minikube image load "${IMAGE_NAME}:${IMAGE_TAG}"
    - helm upgrade --install booking-service helm/booking-service --namespace "${NAMESPACE}" -f values-staging.yaml
    - kubectl rollout status deployment/booking-service --namespace "${NAMESPACE}" --timeout=180s

tag:
  stage: tag
  needs: ["deploy"]
  script:
    - export RELEASE_TAG="booking-service-$(date -u +%Y%m%d%H%M%S)"
    - git tag "${RELEASE_TAG}"
    - echo "Created local tag ${RELEASE_TAG}"
