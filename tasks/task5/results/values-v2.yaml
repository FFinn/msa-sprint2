version: v2

replicaCount: 1

image:
  name: booking-service
  tag: latest
  pullPolicy: Never

ENABLE_FEATURE_X: "true"
SERVICE_VERSION: "v2"

env:
  - name: SERVICE_MODE
    value: "mesh-v2"
  - name: FALLBACK_TEST_MODE
    value: "success"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
