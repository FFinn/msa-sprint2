services:
  apollo-gateway:
    build: ./gateway
    ports:
      - "4000:4000"
    depends_on:
      booking-subgraph:
        condition: service_healthy
      hotel-subgraph:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:'query { __typename }'})}).then(async r=>{const body=await r.json();process.exit(r.ok && !body.errors ? 0 : 1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - hotelio-net

  booking-subgraph:
    build: ./booking-subgraph
    ports:
      - "4001:4001"
    environment:
      BOOKING_GRPC_ADDRESS: booking-service:9090
    depends_on:
      booking-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:'query { __typename }'})}).then(async r=>{const body=await r.json();process.exit(r.ok && !body.errors ? 0 : 1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - hotelio-net

  hotel-subgraph:
    build: ./hotel-subgraph
    ports:
      - "4002:4002"
    environment:
      HOTEL_API_URL: http://monolith:8080/api/hotels
    depends_on:
      monolith:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4002/',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:'query { __typename }'})}).then(async r=>{const body=await r.json();process.exit(r.ok && !body.errors ? 0 : 1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - hotelio-net

  booking-service:
    build:
      context: ../task2
      dockerfile: booking-service/Dockerfile
    ports:
      - "9090:9090"
    environment:
      DATABASE_URL: postgresql://hotelio:hotelio@booking-db:5432/bookings
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONOLITH_BASE_URL: http://monolith:8080
      BOOKING_CREATED_TOPIC: booking-created
      GRPC_PORT: 9090
    depends_on:
      booking-db:
        condition: service_healthy
      monolith:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 9090), 2); s.close()\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - hotelio-net

  booking-db:
    image: postgres:15
    environment:
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
      POSTGRES_DB: bookings
    volumes:
      - booking-db-data:/var/lib/postgresql/data
      - ./booking-db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelio -d bookings"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - hotelio-net

  monolith:
    build: ../monolith
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://monolith-db:5432/hotelio
      SPRING_DATASOURCE_USERNAME: hotelio
      SPRING_DATASOURCE_PASSWORD: hotelio
    depends_on:
      monolith-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-lc", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      - hotelio-net

  monolith-db:
    image: postgres:15
    environment:
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
      POSTGRES_DB: hotelio
    volumes:
      - monolith-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelio -d hotelio"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - hotelio-net

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      zookeeper:
        condition: service_started
    networks:
      - hotelio-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hotelio-net

volumes:
  booking-db-data:
  monolith-db-data:

networks:
  hotelio-net:
