services:
  monolith:
    build:
      context: ../monolith
      dockerfile: Dockerfile
    container_name: hotelio-monolith
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://monolith-db:5432/hotelio
      SPRING_DATASOURCE_USERNAME: hotelio
      SPRING_DATASOURCE_PASSWORD: hotelio
      BOOKING_SERVICE_EXTERNAL_HOST: booking-service
      BOOKING_SERVICE_EXTERNAL_PORT: 9090
    depends_on:
      monolith-db:
        condition: service_healthy
    networks:
      - hotelio-net

  monolith-db:
    image: postgres:15
    container_name: hotelio-db
    environment:
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
      POSTGRES_DB: hotelio
    volumes:
      - monolith-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelio -d hotelio"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - hotelio-net

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: hotelio-booking-service
    ports:
      - "9090:9090"
    environment:
      DATABASE_URL: postgresql://hotelio:hotelio@booking-db:5432/bookings
      MONOLITH_BASE_URL: http://monolith:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BOOKING_CREATED_TOPIC: booking-created
      GRPC_PORT: 9090
    depends_on:
      booking-db:
        condition: service_healthy
      monolith:
        condition: service_started
      kafka:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 9090), 2); s.close()\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - hotelio-net

  booking-db:
    image: postgres:15
    container_name: hotelio-booking-db
    environment:
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
      POSTGRES_DB: bookings
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelio -d bookings"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - hotelio-net

  booking-history-service:
    build: ./booking-history-service
    container_name: hotelio-booking-history-service
    environment:
      DATABASE_URL: postgresql://hotelio:hotelio@booking-history-db:5432/booking_history
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BOOKING_CREATED_TOPIC: booking-created
      CONSUMER_GROUP_ID: booking-history-service
    depends_on:
      booking-history-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - hotelio-net

  booking-history-db:
    image: postgres:15
    container_name: hotelio-booking-history-db
    environment:
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
      POSTGRES_DB: booking_history
    volumes:
      - booking-history-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelio -d booking_history"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - hotelio-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    container_name: hotelio-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hotelio-net

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    container_name: hotelio-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      zookeeper:
        condition: service_started
    networks:
      - hotelio-net

volumes:
  monolith-db-data:
  booking-db-data:
  booking-history-db-data:

networks:
  hotelio-net:
    external: true
